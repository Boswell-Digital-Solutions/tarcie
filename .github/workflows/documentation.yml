name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'doc/**'
      - '**/*.md'
      - '.github/workflows/documentation.yml'

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation (system build and snapshots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the system document and validate snapshots
        run: bash doc/system/BUILD.sh

      # doc/TARSYSTEM.md is assembled output. A change to doc/system/ that
      # ships without a rebuild leaves the compiled artifact stale.
      - name: Check the compiled document is not stale
        run: git diff --exit-code -- doc
